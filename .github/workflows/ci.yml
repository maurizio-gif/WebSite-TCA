name: CI

# Verifica ogni PR e ogni push su main prima che raggiunga la produzione:
# tipi Astro, build completa e assenza di redirect self-loop o di
# sovrapposizione con pagine reali in vercel.json (bug che hanno reso
# irraggiungibili /agonistica, /tennis, le pagine /news e l'intero sito in
# inglese — vedi scripts/check-vercel-redirects.mjs).
#
# Verifica inoltre che lo schema TinaCMS generato e committato sia allineato a
# tina/config.ts: TinaCloud legge lo schema da tina/tina-lock.json, che la build
# di produzione non aggiorna, quindi il lock può restare indietro e far apparire
# "GraphQL Schema Mismatch" nell'admin (vedi scripts/check-tina-lock.mjs).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Controlla redirect vercel.json (self-loop)
        run: npm run check:redirects

      # Rigenera lo schema in una directory temporanea e lo confronta con i file
      # committati: non sporca il workspace (in particolare non crea
      # public/admin/, che manderebbe "astro check" in out-of-memory).
      - name: Controlla allineamento schema TinaCMS (tina-lock.json)
        run: npm run check:tina

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Controlla redirect vercel.json (sovrapposizione con pagine reali)
        run: npm run check:redirects
